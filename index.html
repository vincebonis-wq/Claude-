<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Générateur Attestation Fiscale SAP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      border: 1px solid #e8e8e8;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #444;
    }

    input, select {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #1a1a1a;
      background: white;
    }

    input[readonly] {
      background: #f0f0f0;
      color: #666;
      cursor: not-allowed;
    }

    .computed-row {
      display: flex;
      gap: 14px;
      margin-top: 4px;
    }

    .computed-row .field {
      flex: 1;
    }

    .badge {
      display: inline-block;
      background: #f0f0f0;
      color: #555;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
      font-weight: 400;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .btn:hover {
      background: #333;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .info-box {
      background: #f8f8f5;
      border: 1px solid #e8e8e0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #666;
      margin-top: 14px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
      .computed-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Attestation Fiscale SAP</h1>
    <p class="subtitle">Service à la Personne · Crédit d'impôt 50%</p>

    <!-- Bloc Coach -->
    <div class="card">
      <div class="card-title">Vos informations <span class="badge">Coach / Prestataire</span></div>
      <div class="grid-2">
        <div class="field">
          <label>Prénom</label>
          <input type="text" id="coachPrenom" placeholder="Jean" />
        </div>
        <div class="field">
          <label>Nom</label>
          <input type="text" id="coachNom" placeholder="Dupont" />
        </div>
        <div class="field full">
          <label>Adresse complète</label>
          <input type="text" id="coachAdresse" placeholder="12 rue des Lilas, 75001 Paris" />
        </div>
        <div class="field">
          <label>N° d'agrément SAP</label>
          <input type="text" id="coachAgrement" placeholder="SAP123456789" />
        </div>
        <div class="field">
          <label>Année fiscale</label>
          <select id="annee">
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2025">2025</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Bloc Client -->
    <div class="card">
      <div class="card-title">Informations client <span class="badge">Bénéficiaire</span></div>
      <div class="grid-2">
        <div class="field">
          <label>Prénom</label>
          <input type="text" id="clientPrenom" placeholder="Marie" />
        </div>
        <div class="field">
          <label>Nom</label>
          <input type="text" id="clientNom" placeholder="Martin" />
        </div>
        <div class="field full">
          <label>Adresse complète</label>
          <input type="text" id="clientAdresse" placeholder="8 avenue Victor Hugo, 69001 Lyon" />
        </div>
      </div>
    </div>

    <!-- Bloc Séances -->
    <div class="card">
      <div class="card-title">Détail des séances</div>
      <div class="grid-2">
        <div class="field">
          <label>Montant total payé (€)</label>
          <input type="number" id="montant" placeholder="1200" min="0" step="0.01" oninput="calculer()" />
        </div>
        <div class="field">
          <label>Nombre de séances</label>
          <input type="number" id="nbSeances" placeholder="40" min="1" oninput="calculer()" />
        </div>
        <div class="field">
          <label>Durée par séance (h)</label>
          <input type="number" id="dureeSeance" value="1" min="0.5" step="0.5" oninput="calculer()" />
        </div>
      </div>
      <div class="computed-row">
        <div class="field">
          <label>Total heures</label>
          <input type="text" id="totalHeures" readonly placeholder="—" />
        </div>
        <div class="field">
          <label>Taux horaire</label>
          <input type="text" id="tauxHoraire" readonly placeholder="—" />
        </div>
      </div>
      <div class="info-box">
        Le bénéficiaire peut déduire <strong>50% du montant</strong> de ses impôts, soit jusqu'à <strong id="creditEstime">—</strong> de crédit d'impôt.
      </div>
    </div>

    <button class="btn" onclick="genererPDF()" id="btnGenerer">
      Télécharger l'attestation PDF
    </button>
  </div>

  <script>
    function calculer() {
      const montant = parseFloat(document.getElementById('montant').value) || 0;
      const nb = parseFloat(document.getElementById('nbSeances').value) || 0;
      const duree = parseFloat(document.getElementById('dureeSeance').value) || 1;

      const totalH = nb * duree;
      const taux = totalH > 0 ? montant / totalH : 0;
      const credit = montant * 0.5;

      document.getElementById('totalHeures').value = totalH > 0 ? totalH.toFixed(1) + ' h' : '';
      document.getElementById('tauxHoraire').value = taux > 0 ? taux.toFixed(2) + ' €/h' : '';
      document.getElementById('creditEstime').textContent = credit > 0 ? credit.toFixed(2) + ' €' : '—';
    }

    function val(id) {
      return document.getElementById(id).value.trim();
    }

    function genererPDF() {
      // Validation basique
      const requis = [
        ['coachPrenom', 'Votre prénom'],
        ['coachNom', 'Votre nom'],
        ['coachAdresse', 'Votre adresse'],
        ['coachAgrement', 'N° d\'agrément SAP'],
        ['clientPrenom', 'Prénom du client'],
        ['clientNom', 'Nom du client'],
        ['clientAdresse', 'Adresse du client'],
        ['montant', 'Montant total'],
        ['nbSeances', 'Nombre de séances'],
      ];

      for (const [id, label] of requis) {
        if (!val(id)) {
          alert(`Champ requis : ${label}`);
          document.getElementById(id).focus();
          return;
        }
      }

      const btn = document.getElementById('btnGenerer');
      btn.disabled = true;
      btn.textContent = 'Génération en cours…';

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ format: 'a4', unit: 'mm' });

        const annee = val('annee');
        const coachNomComplet = `${val('coachPrenom')} ${val('coachNom')}`;
        const clientNomComplet = `${val('clientPrenom')} ${val('clientNom')}`;
        const montant = parseFloat(document.getElementById('montant').value);
        const nb = parseFloat(document.getElementById('nbSeances').value);
        const duree = parseFloat(document.getElementById('dureeSeance').value) || 1;
        const totalH = nb * duree;
        const taux = totalH > 0 ? (montant / totalH).toFixed(2) : '—';
        const credit = (montant * 0.5).toFixed(2);

        const margin = 25;
        const pageW = 210;
        const contentW = pageW - margin * 2;
        let y = 25;

        // Helpers
        const line = (x1, y1, x2, y2, color = [220, 220, 220]) => {
          doc.setDrawColor(...color);
          doc.line(x1, y1, x2, y2);
        };
        const text = (t, x, yPos, opts = {}) => {
          doc.text(t, x, yPos, opts);
        };

        // ── En-tête ─────────────────────────────────────────────────────────
        doc.setFillColor(26, 26, 26);
        doc.rect(0, 0, 210, 38, 'F');

        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(17);
        text('ATTESTATION FISCALE', margin, 18);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        text('Service à la Personne · Crédit d\'impôt 50%', margin, 27);

        doc.setFontSize(10);
        text(`Année ${annee}`, pageW - margin, 27, { align: 'right' });

        y = 52;
        doc.setTextColor(26, 26, 26);

        // ── Bloc prestataire ────────────────────────────────────────────────
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(130, 130, 130);
        text('PRESTATAIRE', margin, y);

        y += 6;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(26, 26, 26);
        text(coachNomComplet, margin, y);

        y += 5;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(80, 80, 80);
        text(val('coachAdresse'), margin, y);

        y += 5;
        text(`N° d'agrément SAP : ${val('coachAgrement')}`, margin, y);

        // ── Séparateur ──────────────────────────────────────────────────────
        y += 12;
        line(margin, y, pageW - margin, y);

        // ── Bloc bénéficiaire ────────────────────────────────────────────────
        y += 10;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(130, 130, 130);
        text('BÉNÉFICIAIRE', margin, y);

        y += 6;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(26, 26, 26);
        text(clientNomComplet, margin, y);

        y += 5;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(80, 80, 80);
        text(val('clientAdresse'), margin, y);

        // ── Séparateur ──────────────────────────────────────────────────────
        y += 14;
        line(margin, y, pageW - margin, y);

        // ── Corps de l'attestation ───────────────────────────────────────────
        y += 12;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        doc.setTextColor(40, 40, 40);

        const intro = `Je soussigné(e) ${coachNomComplet}, prestataire de services à la personne agréé(e) sous le numéro ${val('coachAgrement')}, atteste avoir accompli au domicile de ${clientNomComplet} les prestations suivantes au titre de l'année ${annee} :`;
        const introLines = doc.splitTextToSize(intro, contentW);
        doc.text(introLines, margin, y);
        y += introLines.length * 5.5 + 6;

        // ── Tableau des données ──────────────────────────────────────────────
        const rows = [
          ['Nature de la prestation', 'Coaching sportif à domicile'],
          ['Montant total des dépenses', `${montant.toFixed(2)} €`],
          ['Nombre de séances', `${nb}`],
          ['Durée par séance', `${duree} h`],
          ['Nombre total d\'heures', `${totalH.toFixed(1)} h`],
          ['Taux horaire', `${taux} €/h`],
        ];

        const col1W = 90;
        const col2X = margin + col1W + 4;
        const rowH = 9;

        for (let i = 0; i < rows.length; i++) {
          const rowY = y + i * rowH;
          if (i % 2 === 0) {
            doc.setFillColor(248, 248, 245);
            doc.rect(margin, rowY - 5.5, contentW, rowH, 'F');
          }
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9.5);
          doc.setTextColor(100, 100, 100);
          text(rows[i][0], margin + 3, rowY);

          doc.setFont('helvetica', 'bold');
          doc.setTextColor(26, 26, 26);
          text(rows[i][1], col2X, rowY);
        }

        y += rows.length * rowH + 6;

        // ── Encadré crédit d'impôt ───────────────────────────────────────────
        y += 4;
        doc.setFillColor(240, 248, 240);
        doc.setDrawColor(180, 220, 180);
        doc.roundedRect(margin, y, contentW, 16, 3, 3, 'FD');

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(40, 100, 40);
        text(`Crédit d'impôt estimé (50%) : ${credit} €`, margin + contentW / 2, y + 10, { align: 'center' });

        // ── Clause légale ────────────────────────────────────────────────────
        y += 24;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(120, 120, 120);
        const legal = `Cette attestation est établie conformément à l'article L.7233-1 du Code du travail et à l'article 199 sexdecies du Code général des impôts. Elle doit être conservée et peut être réclamée par l'administration fiscale.`;
        const legalLines = doc.splitTextToSize(legal, contentW);
        doc.text(legalLines, margin, y);

        // ── Signature ────────────────────────────────────────────────────────
        y += legalLines.length * 4.5 + 14;

        const today = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(80, 80, 80);
        text(`Fait à __________________, le ${today}`, margin, y);

        y += 16;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(26, 26, 26);
        text('Signature du prestataire :', margin, y);

        line(margin, y + 18, margin + 80, y + 18, [180, 180, 180]);

        // ── Pied de page ─────────────────────────────────────────────────────
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(180, 180, 180);
        text(`Document généré le ${today} · Attestation Fiscale SAP ${annee}`, pageW / 2, 288, { align: 'center' });

        // ── Téléchargement ────────────────────────────────────────────────────
        const nomFichier = `attestation_sap_${annee}_${val('clientNom').toLowerCase().replace(/\s+/g, '_')}.pdf`;
        doc.save(nomFichier);

      } catch (e) {
        alert('Erreur lors de la génération du PDF. Vérifiez votre connexion internet.');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Télécharger l\'attestation PDF';
      }
    }
  </script>
</body>
</html>
